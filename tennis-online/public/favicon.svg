<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tennis Online">
  <title>Tennis Online</title>
  <defs>
    <!-- Keeps the string lines inside the racket head -->
    <clipPath id="racketHead">
      <ellipse cx="32" cy="23" rx="11.5" ry="14"/>
    </clipPath>
  </defs>

  <!-- Solid tile so the mark stays readable on light and dark tab bars -->
  <rect width="64" height="64" rx="14" fill="#1a4f8c"/>

  <g transform="rotate(38 32 32)">
    <g clip-path="url(#racketHead)" stroke="#ffffff" stroke-width="1.4" opacity=".7">
      <path d="M24.5 7v32M32 7v32M39.5 7v32M19 16h26M19 23h26M19 30h26"/>
    </g>
    <ellipse cx="32" cy="23" rx="11.5" ry="14" fill="none" stroke="#ffffff" stroke-width="4"/>
    <!-- Throat into the grip -->
    <path d="M32 37v16" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"/>
  </g>

  <!-- Ball, ringed in the tile colour so it reads even where it meets the head -->
  <circle cx="48" cy="47.5" r="8.6" fill="#1a4f8c"/>
  <circle cx="48" cy="47.5" r="6.8" fill="#cfeb3f"/>
  <path d="M42.6 43.2c2.4 1.3 3.6 2.6 3.6 4.3s-1.2 3-3.6 4.3" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round"/>
</svg>
